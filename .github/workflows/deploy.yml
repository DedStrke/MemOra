# DISABLED: the site now deploys to Firebase Hosting (memoraa.web.app), which
# serves from the domain root, so vite.config.js sets base: '/'. A build with
# that base cannot work on GitHub Pages, where the site lives under /MemOra/ -
# every asset URL would 404. Left in place rather than deleted so the Pages
# setup is recoverable: to go back, restore base: '/MemOra/' and the
# GitHub-Pages origin in src/lib/seo.js, then re-add the push trigger below.
name: Deploy to GitHub Pages (disabled - now on Firebase)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
